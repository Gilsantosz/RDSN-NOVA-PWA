name: 🚀 Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'          # Ativado apenas em tags de versão ex: v2.1.0
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar release no GitHub?'
        required: false
        default: 'true'

permissions:
  contents: write   # necessário para criar GitHub Releases

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para o electron-builder ler a tag

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build Vite + Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Nunca expor SERVICE_ROLE_KEY (Lei 01 — Isolamento de Segurança Smith)
        run: npm run release

      - name: 📤 Upload artefatos locais (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.platform }}
          path: release/
          retention-days: 3
