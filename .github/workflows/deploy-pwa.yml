name: Deploy PWA to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # ATENÇÃO: Nunca adicione SUPABASE_SERVICE_ROLE_KEY nestas definições (Lei 01: Isolamento Smith)
  # Apenas as chaves públicas (Anon) são permitidas para o PWA (Frontend)
  VITE_PWA_SUPABASE_URL: ${{ secrets.VITE_PWA_SUPABASE_URL }}
  VITE_PWA_SUPABASE_ANON_KEY: ${{ secrets.VITE_PWA_SUPABASE_ANON_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      # Deploy de Preview para PRs e Homologação
      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          build-cmd: "npm run build:web"

      # Deploy de Produção para branch Principal
      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          build-cmd: "npm run build:web"
