name: 🌐 Deploy PWA (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca adicionar SUPABASE_SERVICE_ROLE_KEY aqui (Lei 01 — Isolamento Smith)
# A chave anon é pública e pode ser hardcoded como fallback de segurança
env:
  VITE_BUILD_TARGET: web
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://saczzyiofmlvygsopfws.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhY3p6eWlvZm1sdnlnc29wZndzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NDA0MzIsImV4cCI6MjA4ODIxNjQzMn0.Uv-HzvaHDbskLxcOaoHtzVq-QWcmDl6x9FUTe3VFiNQ' }}

jobs:
  deploy:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build PWA (web target)
        run: npm run build:web

      - name: ✅ Verificar build
        run: |
          ls -lah dist/
          test -f dist/index.html || (echo "❌ dist/index.html não encontrado!" && exit 1)
          test -f dist/sw.js && echo "✅ Service Worker gerado" || echo "⚠️  sw.js não encontrado"

      - name: 🚀 Deploy para Vercel (Produção)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: 📢 Notificar Service Worker (force update)
        # Força o SW a se atualizar enviando um header de cache-bust
        # O Vercel já invalida cache automaticamente, mas este step confirma
        run: echo "✅ Deploy concluído — Service Worker será atualizado automaticamente"
